<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇 · GuGeeGoo</title>
  </head>
  <body class="snake-page">
    <header class="snake-header">
      <a class="back-link" href="/">← 导航页</a>
      <h1>🐍 贪吃蛇</h1>
      <p class="tagline">顾景源 · 关卡挑战</p>
    </header>

    <section class="stats-bar">
      <div class="stat">
        <span class="label">关卡</span>
        <span id="stat-level" class="value">—</span>
      </div>
      <div class="stat">
        <span class="label">苹果</span>
        <span id="stat-food" class="value">0 / 0</span>
      </div>
      <div class="stat">
        <span class="label">本局</span>
        <span id="stat-score" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">累计积分</span>
        <span id="stat-lifetime" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">可用积分</span>
        <span id="stat-balance" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">单局最高</span>
        <span id="stat-best" class="value">0</span>
      </div>
    </section>

    <p id="level-hint" class="hint"></p>

    <div class="canvas-wrap">
      <div class="canvas-stage">
        <canvas id="game-canvas" aria-label="贪吃蛇游戏区域"></canvas>
        <div class="dpad-overlay" aria-label="方向控制">
          <button type="button" class="dpad-btn dpad-up" data-dir="up" aria-label="上">▲</button>
          <button type="button" class="dpad-btn dpad-left" data-dir="left" aria-label="左">◀</button>
          <button type="button" class="dpad-btn dpad-right" data-dir="right" aria-label="右">▶</button>
          <button type="button" class="dpad-btn dpad-down" data-dir="down" aria-label="下">▼</button>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button type="button" id="btn-pause" class="btn">暂停</button>
      <button type="button" id="btn-restart" class="btn">重开本关</button>
      <button type="button" id="btn-shop" class="btn btn-shop">道具商店</button>
      <button type="button" id="btn-home" class="btn btn-ghost">回导航页</button>
    </div>

    <section class="side-panel">
      <label class="nick-label">
        昵称（排行榜用）
        <input type="text" id="nick-input" autocomplete="nickname" />
      </label>
      <h2 class="lb-title">🏆 排行榜 TOP 10</h2>
      <ol id="leaderboard-list" class="leaderboard"></ol>
    </section>

    <div id="overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-msg"></p>
        <div id="overlay-actions" class="overlay-actions"></div>
      </div>
    </div>

    <div id="shop-overlay" class="overlay shop-overlay" hidden>
      <div class="overlay-card shop-card">
        <h2>🛒 道具商店</h2>
        <p class="shop-balance">
          可用积分：<strong id="shop-balance">0</strong>
          <span class="shop-lifetime">（累计 <span id="shop-lifetime">0</span>）</span>
        </p>
        <ul id="shop-list" class="shop-list"></ul>
        <p id="shop-msg" class="shop-msg" role="status"></p>
        <button type="button" id="btn-shop-close" class="btn btn-primary">关闭</button>
      </div>
    </div>

    <script type="module" src="/src/snake/main.js"></script>
  </body>
</html>
