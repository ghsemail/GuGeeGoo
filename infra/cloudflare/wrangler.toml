# GuGeeGoo 学生主页 — Cloudflare Pages（Direct Upload）
# 部署：GitHub Actions 或 `npm run deploy:pages`（见 infra/cloudflare/pages.md）
#
# 线上项目（已在 Cloudflare 创建）：
#   名称：gugeegoo
#   默认 URL：https://gugeegoo.pages.dev
#   Production branch：main（由 CI 在 push main 时发布生产）

name = "gugeegoo"
compatibility_date = "2024-09-01"
account_id = "15b1233497d3363a2240f8a54f900fe2"

# 与 `npm run web:build` 输出一致；wrangler pages deploy 可显式传目录，此项供 Pages 本地预览等工具参考
pages_build_output_dir = "apps/web/dist"

# Pages Functions（apps/web/functions/）— 贪吃蛇分数 / 排行榜
# 家长在 Cloudflare 创建 KV 后，把 namespace id 填入下方并取消注释；
# 同时在 Pages 项目 gugeegoo → Settings → Functions → KV bindings 绑定同名 GAME_KV。
#
# [[kv_namespaces]]
# binding = "GAME_KV"
# id = "<待家长提供 namespace id>"

# ---------------------------------------------------------------------------
# 以下为预留独立 Worker（COS 预签名 URL 等），与 Pages Functions 分开部署。
# 模板见：wrangler.worker.toml.example
# ---------------------------------------------------------------------------
