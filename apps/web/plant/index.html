<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>养电子植物 · GuGeeGoo</title>
  </head>
  <body class="plant-page">
    <header class="plant-header">
      <a class="back-link" href="/">← 回导航页</a>
      <h1>🌱 养电子植物</h1>
      <p class="tagline">顾景源 · 慢慢照顾小苔藓</p>
    </header>

    <main class="plant-main">
      <section class="plant-section plant-section-pick" aria-labelledby="pick-heading">
        <h2 id="pick-heading" class="section-title">挑苔藓</h2>
        <div id="bryophyte-picker" class="bryophyte-picker"></div>
      </section>

      <section class="plant-section plant-section-display" aria-labelledby="display-heading">
        <h2 id="display-heading" class="section-title visually-hidden">植物展示</h2>
        <div class="display-stack">
          <div class="pot-scene" aria-hidden="true">
            <div id="plant-3d-mount" class="plant-3d-mount"></div>
            <button
              type="button"
              id="plant-3d-reset"
              class="plant-3d-reset"
              aria-label="重置视角"
              title="重置视角"
              hidden
            >
              ↺
            </button>
            <div class="pot pot--fallback" id="pot-fallback">
              <div class="pot-rim"></div>
              <div class="pot-body">
                <div class="soil-spot">
                  <svg
                    id="plant-draw"
                    class="plant-draw"
                    viewBox="0 0 100 100"
                    aria-hidden="true"
                  ></svg>
                  <p id="soil-placeholder" class="soil-placeholder-text">点上面的卡片种下苔藓</p>
                </div>
              </div>
            </div>
          </div>
          <p id="growth-stage-label" class="growth-stage-label"></p>
          <div class="growth-progress" aria-hidden="true">
            <span id="growth-progress-fill" class="growth-progress-fill"></span>
          </div>
          <div class="plant-info-panel" id="plant-info-panel">
            <p id="pot-species-name" class="pot-species-name" hidden></p>
            <p id="pot-species-habit" class="pot-species-habit">
              先挑一种苔藓，看看它喜欢什么样的环境
            </p>
            <p id="mood-hint" class="mood-hint" role="status"></p>
          </div>
        </div>
      </section>

      <section class="plant-section plant-section-status" aria-labelledby="status-heading">
        <h2 id="status-heading" class="section-title">状态</h2>
        <div class="stat-bars">
          <label class="stat-row">
            <span class="stat-label">💧 水分</span>
            <span class="stat-track" aria-hidden="true"><span class="stat-fill" style="width: 40%"></span></span>
            <span class="stat-value">40</span>
          </label>
          <label class="stat-row">
            <span class="stat-label">☀️ 阳光</span>
            <span class="stat-track" aria-hidden="true"><span class="stat-fill stat-fill-sun" style="width: 55%"></span></span>
            <span class="stat-value">55</span>
          </label>
          <label class="stat-row">
            <span class="stat-label">🧪 养分</span>
            <span class="stat-track" aria-hidden="true"><span class="stat-fill stat-fill-nutrient" style="width: 35%"></span></span>
            <span class="stat-value">35</span>
          </label>
        </div>
      </section>

      <section class="plant-section plant-section-care" aria-labelledby="care-heading">
        <h2 id="care-heading" class="section-title">照顾</h2>
        <div class="care-row">
          <button type="button" class="care-btn" data-care="water">💧 浇水</button>
          <button type="button" class="care-btn" data-care="light">☀️ 晒太阳</button>
          <button type="button" class="care-btn" data-care="nutrient">🧪 施肥</button>
        </div>
      </section>

      <section class="plant-section plant-section-save" aria-labelledby="save-heading">
        <h2 id="save-heading" class="section-title">存档 · 图鉴</h2>
        <div class="save-row">
          <button type="button" id="btn-save" class="save-btn">💾 保存</button>
          <button type="button" id="btn-load" class="save-btn">📂 读取</button>
          <button type="button" id="btn-restart" class="save-btn save-btn-restart">🔄 重新开始</button>
        </div>
        <div class="atlas-panel">
          <h3 class="atlas-title">我的苔藓图鉴</h3>
          <ul id="atlas-list" class="atlas-list"></ul>
        </div>
      </section>
    </main>

    <p id="plant-fact" class="plant-fact"></p>
    <p id="plant-toast" class="plant-toast" hidden role="status"></p>

    <div id="plant-overlay" class="plant-overlay" hidden>
      <div class="plant-overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-msg"></p>
        <button type="button" id="overlay-close" class="care-btn overlay-btn">太棒了！</button>
      </div>
    </div>

    <script type="module" src="/src/plant/main.js"></script>
  </body>
</html>
