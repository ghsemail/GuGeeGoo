<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>打地鼠 · GuGeeGoo</title>
  </head>
  <body class="arcade-page whack-page">
    <header class="arcade-header">
      <a class="back-link" href="/">← 导航页</a>
      <h1>🔨 打地鼠</h1>
      <p class="tagline">顾景源 · 反应大挑战</p>
    </header>

    <section id="screen-menu" class="screen screen-menu">
      <p class="menu-welcome">点冒出来的地鼠！⭐ 加分，💣 别乱敲～</p>
      <p class="wallet-line">
        累计 <strong id="menu-lifetime">0</strong> 分 · 最高
        <strong id="menu-best">0</strong> 分
      </p>
      <div class="menu-actions">
        <button type="button" id="btn-menu-play" class="btn btn-primary btn-lg">
          开始游戏
        </button>
        <a class="btn btn-lg btn-ghost menu-nav-link" href="/">返回导航页</a>
      </div>
      <p class="menu-hint">60 秒 · 3 条命 · 分数高了变成 4×4 洞</p>
    </section>

    <section id="screen-game" class="screen screen-game" hidden>
      <div class="hud-bar">
        <div class="hud-item">
          <span class="hud-label">得分</span>
          <span id="hud-score" class="hud-value">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">时间</span>
          <span id="hud-time" class="hud-value">60</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">生命</span>
          <span id="hud-lives" class="hud-value">❤️❤️❤️</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">格子</span>
          <span id="hud-grid" class="hud-value">3×3</span>
        </div>
      </div>

      <div class="canvas-wrap game-controls-block">
        <div class="canvas-board-wrap game-touch-zone">
          <canvas id="game-canvas" aria-label="打地鼠游戏区域"></canvas>
        </div>
      </div>

      <div class="toolbar">
        <button type="button" id="btn-pause" class="btn">暂停</button>
        <button type="button" id="btn-exit" class="btn btn-primary">退出回菜单</button>
      </div>
    </section>

    <div id="overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-msg"></p>
        <div id="overlay-actions" class="overlay-actions"></div>
      </div>
    </div>

    <script type="module" src="/src/whack/main.js"></script>
  </body>
</html>
